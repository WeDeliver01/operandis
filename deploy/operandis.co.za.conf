# /etc/nginx/sites-available/operandis.co.za — install steps in docs/vps-deployment.md
# certbot --nginx adds the HTTPS server block and certificates automatically.

# Redirect www → apex
server {
    listen 80;
    listen [::]:80;
    server_name www.operandis.co.za;
    return 301 https://operandis.co.za$request_uri;
}

server {
    listen 80;
    listen [::]:80;
    server_name operandis.co.za;

    # Uploads are limited to 15 MB by the app; leave a little headroom.
    client_max_body_size 16m;

    location / {
        proxy_pass http://127.0.0.1:5100;   # must match APP_PORT in deploy/.env.production
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
