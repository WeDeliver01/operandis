# nginx site for operandis.co.za on web01 (install steps: docs/vps-deployment.md, step 6).
#
# - Install as /etc/nginx/sites-available/operandis.co.za.conf and link it into
#   sites-enabled under the same name. web01's nginx only loads files ending in
#   ".conf"; a link named plain "operandis.co.za" is silently ignored.
# - The certificate must exist before this file is enabled. Get it with
#   "certbot certonly --nginx ...", which never edits nginx files. Do not use
#   "certbot --nginx" (install mode): on web01 it writes into the shared default.conf.
# - proxy_pass must use the same port as APP_PORT in deploy/.env.production.
# - "http2 on;" needs nginx 1.25.1 or newer (web01 has it).

# HTTP → HTTPS. The redirect sits inside "location /" so that certbot's
# temporary "location = /.well-known/acme-challenge/..." still wins at renewal.
server {
    listen 80;
    listen [::]:80;
    server_name operandis.co.za www.operandis.co.za;

    location / {
        return 301 https://operandis.co.za$request_uri;
    }
}

# https://www → https://apex
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name www.operandis.co.za;

    ssl_certificate     /etc/letsencrypt/live/operandis.co.za/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/operandis.co.za/privkey.pem;

    return 301 https://operandis.co.za$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name operandis.co.za;

    ssl_certificate     /etc/letsencrypt/live/operandis.co.za/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/operandis.co.za/privkey.pem;

    # Uploads are limited to 15 MB by the app; leave a little headroom.
    client_max_body_size 16m;

    location / {
        proxy_pass http://127.0.0.1:5100;   # must match APP_PORT in deploy/.env.production
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 60s;
    }
}
