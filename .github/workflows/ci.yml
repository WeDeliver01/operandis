name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: operandis
          POSTGRES_PASSWORD: operandis
          POSTGRES_DB: operandis_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U operandis"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://operandis:operandis@localhost:5432/operandis_test
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Typecheck
        run: pnpm typecheck
      - name: Unit + integration tests
        run: pnpm test
      - name: Production build
        run: PORT=5173 BASE_PATH=/ pnpm -r --if-present run build
